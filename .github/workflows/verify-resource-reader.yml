name: Verify source digest preview

on:
  pull_request:
    paths:
      - ".github/workflows/verify-resource-reader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Cloudflare Pages preview and resource reading content
        shell: bash
        run: |
          set -uo pipefail
          base="https://design-resource-digest-reade.kaisha-compass.pages.dev"
          for attempt in $(seq 1 12); do
            failures=0
            echo "Pages preview check ${attempt}/12 at $base"
            for pair in "nta-new-corporation:ここで押さえる3つのポイント" "moj-incorporation:会社のどんなときに使う？" "houmukyoku-head-office-online:原典で確認したいこと"; do
              slug="${pair%%:*}"
              phrase="${pair#*:}"
              url="$base/resources/$slug/"
              status=$(curl -L -sS -o /tmp/resource-response -w '%{http_code}' --connect-timeout 8 --max-time 15 "$url" || true)
              if [[ "$status" == "200" ]] && grep -Fq "$phrase" /tmp/resource-response && grep -Fq "4 原典" /tmp/resource-response; then
                echo "PASS HTTP200, label, sections, external semantics: $slug"
              else
                echo "FAIL status=${status:-000}: $slug"
                failures=1
              fi
            done
            if [[ "$failures" -eq 0 ]]; then exit 0; fi
            if [[ $attempt -lt 12 ]]; then sleep 12; fi
          done
          echo "::error::Source digest preview HTTP/content verification failed."
          exit 1
