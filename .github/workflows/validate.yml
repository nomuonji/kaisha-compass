name: Validate Astro

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: UX contract
        run: npm run check:ux
      - name: Check interactive explanation models
        run: node scripts/test-interactive-models.mjs
      - name: Build
        run: npm run build
      - name: Check deployable public routes
        run: node scripts/check-deploy-assets.mjs
