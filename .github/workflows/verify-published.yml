name: Verify published pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "astro.config.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/verify-published.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live pages after the publishing window
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            "https://kaisha-compass.antonbase.com/"
            "https://kaisha-compass.antonbase.com/practice/"
            "https://kaisha-compass.antonbase.com/practice/kk-or-gk/"
            "https://kaisha-compass.antonbase.com/company-law/"
            "https://kaisha-compass.antonbase.com/resources/nta-new-corporation/"
            "https://kaisha-compass.antonbase.com/resources/moj-incorporation/"
            "https://kaisha-compass.antonbase.com/resources/houmukyoku-head-office-online/"
          )
          for attempt in $(seq 1 10); do
            failed=0
            echo "Live smoke attempt ${attempt}/10"
            for url in "${urls[@]}"; do
              status=$(curl -L -sS -o /tmp/kaisha-compass-response -w '%{http_code}' --connect-timeout 10 --max-time 18 "$url" 2>/tmp/kaisha-compass-curl-error || true)
              echo "${status:-000} $url"
              if [[ "$status" != "200" ]]; then
                failed=1
                cat /tmp/kaisha-compass-curl-error || true
              elif [[ "$url" == *"/resources/"* ]] && ! grep -Fq "この資料で分かること" /tmp/kaisha-compass-response; then
                echo "Resource reader content missing: $url"
                failed=1
              fi
            done
            if [[ $failed -eq 0 ]]; then
              echo "All live pages returned HTTP 200."
              exit 0
            fi
            if [[ $attempt -lt 10 ]]; then sleep 15; fi
          done
          echo "::error::Cloudflare production does not serve all expected pages. Check Cloudflare Pages deployment, output directory and deployed commit."
          exit 1
