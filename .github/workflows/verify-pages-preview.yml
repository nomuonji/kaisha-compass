name: Verify Pages preview HTTP

on:
  pull_request:
    paths:
      - ".github/workflows/verify-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe Pages preview root, lessons, styles and CMS Function
        shell: bash
        run: |
          set -uo pipefail
          base="https://fix-pages-output-root-and-cm.kaisha-compass.pages.dev"
          for attempt in $(seq 1 15); do
            failed=0
            echo "Preview HTTP probe ${attempt}/15"
            for route in / /practice/ /practice/kk-or-gk/ /company-law/ /company-law/articles-of-incorporation/ /features/; do
              status=$(curl -L -sS -o /tmp/kaisha-preview-body -w '%{http_code}' --connect-timeout 10 --max-time 20 "$base$route" || true)
              echo "${status:-000} $route"
              if [[ "$status" != "200" ]]; then
                failed=1
              elif ! grep -q 'Kaisha Compass' /tmp/kaisha-preview-body; then
                echo "Expected site content missing: $route"
                failed=1
              fi
            done
            if [[ "$failed" -eq 0 ]]; then
              echo "All Pages preview routes return HTML 200."
              exit 0
            fi
            if [[ "$attempt" -lt 15 ]]; then sleep 12; fi
          done
          echo "::error::Cloudflare Pages preview still fails on at least one route."
          exit 1
